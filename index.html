  html, body { height: 100% }

<canvas id="c" role="img" aria-label="A glowing blue particle flower wilts, revives, blooms inside a sphere of stars, then closes and fades"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) return;

  // ---------- seeded random so every load builds the same plant ----------
  let seed = 20261105;
  const R = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const TAU = Math.PI * 2;
  const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- particle store ----------
  const colA = [], metaA = [], grpA = [];
  let count = 0;
  // group: 0 soil, 1 plant, 2 sphere
  function add(g, r, gr, b, size, alpha, thr) {
    colA.push(r, gr, b);
    metaA.push(size, alpha, thr === undefined ? R() : thr, R());
    grpA.push(g);
    return count++;
  }

  // soil
  const SOIL_N = 5200, soilBase = [];
  const soilStart = count;
  for (let i = 0; i < SOIL_N; i++) {
    const x = R() * 2 - 1;
    const y = Math.pow(R(), 3) * (0.05 + 0.07 * (1 - x * x)) - 0.004;
    const z = (R() * 2 - 1) * 0.4 * (0.45 + 0.55 * (1 - x * x));
    soilBase.push(x, y, z);
    const k = 0.55 + 0.45 * R();
    const near = Math.abs(x) < 0.22 ? 0.5 : 0;
    add(0, lerp(0.82, 0.45, near) * k, lerp(0.84, 0.58, near) * k, lerp(0.92, 1.0, near) * k,
        0.0045 + R() * 0.007, 0.18 + R() * 0.5);
  }

  // stem
  const STEM_N = 1500, stemStart = count;
  const stT = new Float32Array(STEM_N), stB = new Float32Array(STEM_N), stR = new Float32Array(STEM_N);
  for (let i = 0; i < STEM_N; i++) {
    stT[i] = R(); stB[i] = R() * TAU; stR[i] = 0.009 + 0.006 * (1 - stT[i]);
    const k = 0.7 + 0.3 * R();
    add(1, 0.2 * k, 0.4 * k, 1.0 * k, 0.006, 0.6);
  }

  // petals
  const layers = [
    { n: 6, L: 0.44, W: 0.34, off: 0.0,        phiC: 0.10, phiO: 0.98, cC: 0.10, cO: 0.75 },
    { n: 6, L: 0.40, W: 0.34, off: Math.PI / 6, phiC: 0.13, phiO: 0.76, cC: 0.10, cO: 0.65 },
    { n: 5, L: 0.33, W: 0.36, off: 0.3,        phiC: 0.16, phiO: 0.52, cC: 0.10, cO: 0.55 },
    { n: 4, L: 0.24, W: 0.38, off: 0.8,        phiC: 0.18, phiO: 0.28, cC: 0.10, cO: 0.40 },
  ];
  const PET_N = 520;
  const petals = [];
  const petStart = count;
  let pu, pv, pwu;
  {
    const total = layers.reduce((a, l) => a + l.n, 0) * PET_N;
    pu = new Float32Array(total); pv = new Float32Array(total); pwu = new Float32Array(total);
    let idx = 0;
    layers.forEach((l, li) => {
      for (let p = 0; p < l.n; p++) {
        const th = l.off + (p / l.n) * TAU + (R() - 0.5) * 0.18;
        petals.push({ li, th, L: l.L * (0.94 + 0.12 * R()), W: l.W, phiC: l.phiC, phiO: l.phiO * (0.94 + 0.12 * R()), cC: l.cC, cO: l.cO, start: idx });
        for (let i = 0; i < PET_N; i++, idx++) {
          const u = Math.pow(R(), 0.85);
          const kind = R();
          let v;
          if (kind < 0.46) v = (R() * 2 - 1) * 0.95;
          else if (kind < 0.72) v = R() < 0.5 ? -1 : 1;
          else { const vs = [-0.7, -0.4, 0, 0, 0.4, 0.7]; v = vs[(R() * vs.length) | 0]; }
          pu[idx] = u; pv[idx] = v;
          pwu[idx] = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.7)), 0.9);
          const edge = Math.abs(v) > 0.99, vein = kind >= 0.72;
          const k = (edge ? 1.0 : vein ? 0.85 : 0.55) * (0.75 + 0.25 * R());
          const lay = li / 3;
          // blue outside, violet inside, warm glow at inner petal bases
          let r = lerp(0.24, 0.62, lay), g = lerp(0.34, 0.42, lay), b = 1.0;
          const warm = Math.pow(1 - u, 3) * 0.55 * lay;
          r = lerp(r, 0.98, warm); g = lerp(g, 0.55, warm); b = lerp(b, 0.8, warm);
          const tip = Math.max(0, u - 0.8) * 4 * (1 - lay);
          r = lerp(r, 0.55, tip); g = lerp(g, 0.72, tip);
          add(1, r * k, g * k, b * k, edge ? 0.0085 : vein ? 0.0065 : 0.0055, edge ? 0.7 : vein ? 0.6 : 0.3);
        }
      }
    });
  }

  // pistil glow at the heart of the flower
  const PIS_N = 320, pisStart = count;
  const psH = new Float32Array(PIS_N), psR = new Float32Array(PIS_N), psA = new Float32Array(PIS_N);
  for (let i = 0; i < PIS_N; i++) {
    psH[i] = Math.pow(R(), 0.8) * 0.14; psR[i] = R() * 0.03 * (1 - psH[i] / 0.2); psA[i] = R() * TAU;
    add(1, 1.0, 0.55 + 0.15 * R(), 0.5 + 0.3 * R(), 0.0055, 0.45);
  }

  // leaves
  const leafDefs = [
    { t0: 0.05, a: 0.35, L: 0.30 }, { t0: 0.08, a: 2.80, L: 0.30 },
    { t0: 0.17, a: -0.50, L: 0.24 }, { t0: 0.22, a: 3.60, L: 0.24 },
  ];
  const LEAF_N = 1100, leafStart = count;
  const lu = new Float32Array(LEAF_N * 4), lv = new Float32Array(LEAF_N * 4), lwu = new Float32Array(LEAF_N * 4);
  for (let q = 0; q < 4; q++) {
    for (let i = 0; i < LEAF_N; i++) {
      const j = q * LEAF_N + i, kind = R();
      let u, v;
      if (kind < 0.45) { u = Math.pow(R(), 0.9); v = (R() * 2 - 1) * 0.95; }
      else if (kind < 0.67) { u = Math.pow(R(), 0.9); v = R() < 0.5 ? -1 : 1; }
      else if (kind < 0.77) { u = R(); v = 0; }
      else {
        const vi = (R() * 6) | 0, t = R(), sg = R() < 0.5 ? -1 : 1;
        u = Math.min(0.98, 0.12 + 0.13 * vi + t * 0.3); v = sg * t * 0.9;
      }
      lu[j] = u; lv[j] = v; lwu[j] = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.65)), 0.9);
      const edge = Math.abs(v) > 0.99, k = (edge ? 1.0 : kind < 0.67 ? 0.55 : 0.85) * (0.75 + 0.25 * R());
      add(1, 0.18 * k, 0.55 * k, 1.0 * k, edge ? 0.0085 : 0.006, edge ? 0.7 : kind < 0.67 ? 0.35 : 0.6);
    }
  }

  // soft glow behind the flower
  const haloIdx = add(1, 0.28, 0.36, 1.0, 1.0, 0.045, 0);

  // constellation sphere
  const ringN = [[0, 1, 0], [1, 0, 0], [0.7, 0.7, 0], [0.7, -0.7, 0.3], [0, 0.5, 0.86]];
  const RING_P = 280, sphStart = count;
  const ringBasis = ringN.map(n => {
    const l = Math.hypot(...n); n = n.map(x => x / l);
    let a = Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let e1 = [n[1] * a[2] - n[2] * a[1], n[2] * a[0] - n[0] * a[2], n[0] * a[1] - n[1] * a[0]];
    const el = Math.hypot(...e1); e1 = e1.map(x => x / el);
    const e2 = [n[1] * e1[2] - n[2] * e1[1], n[2] * e1[0] - n[0] * e1[2], n[0] * e1[1] - n[1] * e1[0]];
    return { e1, e2 };
  });
  const sphG = new Float32Array(RING_P * 5), sphD = new Float32Array(1000 * 3);
  for (let r = 0; r < 5; r++) for (let i = 0; i < RING_P; i++) {
    sphG[r * RING_P + i] = (i / RING_P) * TAU + (R() - 0.5) * 0.02;
    add(2, 0.5, 0.6, 1.0, 0.0058, 0.85);
  }
  for (let i = 0; i < 1000; i++) {
    let x = R() * 2 - 1, y = R() * 2 - 1, z = R() * 2 - 1; const l = Math.hypot(x, y, z) || 1;
    sphD[i * 3] = x / l; sphD[i * 3 + 1] = y / l; sphD[i * 3 + 2] = z / l;
    const star = R() < 0.05, w = R();
    add(2, lerp(0.55, 0.9, w), lerp(0.65, 0.92, w), 1.0, star ? 0.015 : 0.004 + R() * 0.006, star ? 0.95 : 0.3 + R() * 0.55);
  }

  // ---------- stage 2: lily bouquet (groups 3 = bouquet, 4 = stars) ----------
  const PAL = {
    red:     [[0.96, 0.08, 0.08], [1.0, 0.50, 0.08]],
    pink:    [[0.97, 0.28, 0.80], [1.0, 0.80, 0.85]],
    yellow:  [[1.0, 0.80, 0.06], [0.88, 0.92, 0.30]],
    cream:   [[1.0, 0.93, 0.78], [0.92, 0.86, 0.40]],
    peach:   [[1.0, 0.52, 0.22], [1.0, 0.82, 0.30]],
    crimson: [[0.78, 0.06, 0.12], [0.95, 0.35, 0.10]],
    plum:    [[0.88, 0.22, 0.52], [1.0, 0.62, 0.62]],
  };
  const FLW = [
    { x: -0.32, y: 1.22, z: 0.00, R: 0.233, c: 'cream' },
    { x: 0.04,  y: 1.36, z: -0.06, R: 0.175, c: 'peach' },
    { x: 0.34,  y: 1.22, z: 0.02, R: 0.209, c: 'yellow' },
    { x: 0.02,  y: 1.04, z: 0.20, R: 0.314, c: 'red' },
    { x: 0.40,  y: 0.94, z: 0.10, R: 0.233, c: 'plum' },
    { x: -0.46, y: 0.90, z: 0.05, R: 0.209, c: 'yellow' },
    { x: -0.19, y: 0.70, z: 0.34, R: 0.290, c: 'pink' },
    { x: 0.19,  y: 0.66, z: 0.40, R: 0.290, c: 'cream' },
    { x: -0.48, y: 0.46, z: 0.20, R: 0.209, c: 'yellow' },
    { x: -0.02, y: 0.42, z: 0.50, R: 0.279, c: 'peach' },
    { x: 0.46,  y: 0.40, z: 0.22, R: 0.209, c: 'crimson' },
    { x: -0.13, y: 1.52, z: -0.08, R: 0.116, c: 'crimson', bud: 1 },
    { x: 0.24,  y: 1.48, z: 0.00, R: 0.104, c: 'red', bud: 1 },
    { x: -0.50, y: 1.12, z: -0.05, R: 0.104, c: 'peach', bud: 1 },
  ];
  // heart formation: while the screen is held, the flowers drift into a heart
  FLW.forEach((f, i) => {
    const t = (i / FLW.length) * TAU;
    const yf = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
    f.hx = 0.7 * Math.pow(Math.sin(t), 3);
    f.hy = 0.85 + 0.7 * (yf + 0.375);
    f.hz = 0.12 + 0.12 * Math.sin(3 * t);
    f.hd = ((i * 0.37) % 1) * 0.3;
  });
  const TN_BLOOM = 680, TN_BUD = 200, STEM_PER = 230, STAM_N = 26, LEAF_PER = 300;
  let totalTep = 0;
  FLW.forEach(f => { f.tn = f.bud ? TN_BUD : TN_BLOOM; totalTep += 6 * f.tn; });
  const tU = new Float32Array(totalTep), tV = new Float32Array(totalTep), tW = new Float32Array(totalTep);
  let ti = 0;
  FLW.forEach(f => {
    f.tStart = ti; f.pStart = count;
    const nx = f.x * 0.7, ny = f.bud ? 1.2 : 0.35, nz = f.z * 0.7 + 1.1, nl = Math.hypot(nx, ny, nz);
    f.nf = [nx / nl, ny / nl, nz / nl];
    f.dG = R() * 1.2; f.dB = 3.0 + R() * 1.6; f.bmax = f.bud ? 0.14 : 1;
    f.rotOff = R() * TAU; f.ph = R() * TAU;
    f.bx = (R() - 0.5) * 0.16; f.bz = (R() - 0.5) * 0.16;
    f.p1x = (f.bx + f.x) * 0.35 + (R() - 0.5) * 0.1; f.p1y = f.y * 0.5; f.p1z = (f.bz + f.z) * 0.35;
    const C = PAL[f.c][0], T = PAL[f.c][1];
    for (let k = 0; k < 6; k++) for (let i = 0; i < f.tn; i++, ti++) {
      const u = Math.pow(R(), 0.85), kind = R();
      let v;
      if (kind < 0.72) v = (R() * 2 - 1) * 0.97;
      else if (kind < 0.86) v = R() < 0.5 ? -1 : 1;
      else { const vs = [-0.5, 0, 0, 0.5]; v = vs[(R() * 4) | 0]; }
      tU[ti] = u; tV[ti] = v; tW[ti] = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.85);
      const edge = Math.abs(v) > 0.99, vein = kind >= 0.86, th = sm(u * 1.7);
      let r = lerp(T[0], C[0], th), g = lerp(T[1], C[1], th), b = lerp(T[2], C[2], th);
      if (u < 0.6 && kind < 0.72 && R() < 0.08) { r = C[0] * 0.35; g = C[1] * 0.3; b = C[2] * 0.4; }
      if (Math.abs(v) < 0.05 && u < 0.45) { r = lerp(r, 0.7, 0.5); g = lerp(g, 0.9, 0.5); b = lerp(b, 0.4, 0.5); }
      const k2 = (edge ? 1.0 : vein ? 1.0 : 0.95) * (0.9 + 0.1 * R());
      add(3, Math.min(1, r * k2), Math.min(1, g * k2), Math.min(1, b * k2), edge ? 0.0095 : 0.0105, edge ? 0.95 : 0.9);
    }
  });
  // stamens and pistil
  const sU = new Float32Array(STAM_N);
  for (let i = 0; i < STAM_N; i++) sU[i] = (i + 0.5) / STAM_N;
  FLW.forEach(f => {
    f.sStart = count;
    for (let k = 0; k < 7; k++) for (let i = 0; i < STAM_N; i++) {
      const an = sU[i] > 0.88;
      add(3, an ? 0.8 + 0.15 * R() : 0.85, an ? 0.3 + 0.15 * R() : 0.95, an ? 0.08 : 0.55, an ? 0.011 : 0.0045, an ? 0.95 : 0.6);
    }
  });
  // stems
  FLW.forEach(f => {
    f.stStart = count; f.stT = new Float32Array(STEM_PER); f.stJ = new Float32Array(STEM_PER * 3);
    for (let i = 0; i < STEM_PER; i++) {
      f.stT[i] = R();
      f.stJ[i * 3] = (R() - 0.5) * 0.009; f.stJ[i * 3 + 1] = (R() - 0.5) * 0.004; f.stJ[i * 3 + 2] = (R() - 0.5) * 0.009;
      const k = 0.7 + 0.3 * R();
      add(3, 0.2 * k, 0.85 * k, 0.28 * k, 0.0065, 0.7);
    }
  });
  // leaves
  const LV = [];
  const bLu = new Float32Array(16 * LEAF_PER), bLv = new Float32Array(16 * LEAF_PER), bLw = new Float32Array(16 * LEAF_PER);
  for (let q = 0; q < 16; q++) {
    LV.push({ si: (R() * 11) | 0, t0: 0.1 + R() * 0.3, a: R() * TAU, eps: 0.5 + R() * 0.7, L: 0.30 + R() * 0.16, d: R() * 1.6, start: count });
    for (let i = 0; i < LEAF_PER; i++) {
      const j = q * LEAF_PER + i, kind = R(); let u, v;
      if (kind < 0.45) { u = Math.pow(R(), 0.9); v = (R() * 2 - 1) * 0.95; }
      else if (kind < 0.7) { u = Math.pow(R(), 0.9); v = R() < 0.5 ? -1 : 1; }
      else if (kind < 0.85) { u = R(); v = 0; }
      else { const t = R(), sg = R() < 0.5 ? -1 : 1; u = Math.min(0.98, 0.1 + R() * 0.8); v = sg * t * 0.6; }
      bLu[j] = u; bLv[j] = v; bLw[j] = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9);
      const edge = Math.abs(v) > 0.99, k = (edge ? 1 : 0.75) * (0.75 + 0.25 * R());
      add(3, (0.12 + 0.15 * R()) * k, (0.7 + 0.25 * R()) * k, (0.16 + 0.1 * R()) * k, edge ? 0.0085 : 0.0065, edge ? 0.85 : 0.55);
    }
  }
  const halo2 = add(3, 1.0, 0.62, 0.45, 2.0, 0.03, 0);

  // star specks in the dark (group 4)
  const STAR_N = 320, starStart = count, starBase = [];
  for (let i = 0; i < STAR_N; i++) {
    starBase.push(R() * 2 - 1, 0.15 + R() * 3.0, -1 + R() * 1.4);
    add(4, 0.8, 0.85, 1.0, 0.003 + R() * 0.004, 0.3 + R() * 0.5);
  }

  const N = count;
  const pos = new Float32Array(N * 3);

  // ---------- WebGL ----------
  const vs = `
    attribute vec3 aPos; attribute vec3 aCol; attribute vec4 aMeta; attribute float aGroup;
    uniform mat4 uMVP; uniform float uScale, uTime, uDpr, uLife, uGS; uniform vec4 uGA;
    varying vec4 vC;
    void main(){
      vec4 p = uMVP * vec4(aPos, 1.0);
      gl_Position = p;
      float ga = aGroup < 0.5 ? uGA.x : (aGroup < 1.5 ? uGA.y : (aGroup < 2.5 ? uGA.z : (aGroup < 3.5 ? uGA.w : uGS)));
      float dis = clamp((ga - aMeta.z * 0.85) * 6.0, 0.0, 1.0);
      float tw = 0.78 + 0.22 * sin(uTime * (1.2 + aMeta.w * 2.5) + aMeta.w * 60.0);
      vec3 col = aCol;
      if (aGroup > 0.5 && aGroup < 2.5) {
        float l = dot(col, vec3(0.3, 0.5, 0.2));
        vec3 gr = vec3(0.12 + l * 0.38) * vec3(0.9, 0.88, 1.0);
        col = mix(gr, col, uLife);
      }
      gl_PointSize = max(aMeta.x * uScale / max(p.w, 0.1), 1.5 * uDpr);
      vC = vec4(col, aMeta.y * dis * tw);
    }`;
  const fs = `
    precision mediump float; varying vec4 vC;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = smoothstep(1.0, 0.12, d);
      gl_FragColor = vec4(vC.rgb, vC.a * a);
    }`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = (data, name, size, usage) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage);
    const loc = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    return b;
  };
  const posBuf = buf(pos, 'aPos', 3, gl.DYNAMIC_DRAW);
  buf(new Float32Array(colA), 'aCol', 3, gl.STATIC_DRAW);
  buf(new Float32Array(metaA), 'aMeta', 4, gl.STATIC_DRAW);
  buf(new Float32Array(grpA), 'aGroup', 1, gl.STATIC_DRAW);
  const U = n => gl.getUniformLocation(prog, n);
  const uMVP = U('uMVP'), uScale = U('uScale'), uTime = U('uTime'), uDpr = U('uDpr'), uLife = U('uLife'), uGA = U('uGA'), uGS = U('uGS');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0.008, 0.012, 0.04, 1);

  // ---------- camera ----------
  const FOV = 34 * Math.PI / 180, TF = Math.tan(FOV / 2);
  let cam = null, mvp = new Float32Array(16), soilW = 1.2, W = 1, H = 1, dpr = 1;
  function mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s;
    }
    return o;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(cv.clientWidth * dpr)); H = Math.max(1, Math.round(cv.clientHeight * dpr));
    cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
    const asp = W / H;
    const dist = Math.max(0.92 / TF, 1.0 / (TF * asp));
    const ty = 0.80, ey = ty + dist * 0.26;
    let fx = 0, fy = ty - ey, fz = -dist; const fl = Math.hypot(fy, fz); fy /= fl; fz /= fl;
